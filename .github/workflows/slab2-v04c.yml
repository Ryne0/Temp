name: Slab2 v0.4c official run

on:
  push:
    branches: [slab2-bridge]
    paths: [slab2_trigger.txt]

permissions:
  contents: write

jobs:
  run-v04c:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slab2-bridge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy pandas requests
      - name: Run official Slab2 v0.4c
        run: python slab2_v04c_official.py
      - name: Commit compact results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v04c_summary.csv v04c_targets.csv v04c_slab2_5deg_structure.csv v04c_real_slab2_continuous_10000runs.csv
          git commit -m "Add official Slab2 v0.4c results" || exit 0
          git push origin HEAD:slab2-bridge
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: slab2-v04c-results
          path: |
            v04c_summary.csv
            v04c_targets.csv
            v04c_slab2_5deg_structure.csv
            v04c_real_slab2_continuous_10000runs.csv
