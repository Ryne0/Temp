<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Code → QR Transfer Test</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark}
    body{max-width:1000px;margin:0 auto;padding:24px;line-height:1.5}
    h1{margin-bottom:6px}.muted{opacity:.7}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    textarea{width:100%;min-height:260px;box-sizing:border-box;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px;padding:12px}
    input,button{font:inherit;padding:8px 12px}button{cursor:pointer}
    .card{border:1px solid #8886;border-radius:12px;padding:16px;margin:16px 0}
    #qrList{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
    .qr-card{border:1px solid #8886;border-radius:10px;padding:12px;overflow:hidden}
    .qr{background:white;padding:10px;width:max-content;max-width:100%;margin:auto}
    .payload{width:100%;min-height:120px;margin-top:10px;font-size:11px}
    .status{font-weight:600}
    code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  </style>
</head>
<body>
  <h1>Code → QR Transfer Test</h1>
  <div class="muted">把程式碼切成多段 QR。每段含版本、傳輸 ID、序號、總段數與 CRC32，掃描後可依序重組。</div>

  <div class="card">
    <label for="source"><b>1. 貼上程式碼 / 文字</b></label>
    <textarea id="source" spellcheck="false" placeholder="例如 VBA、Python、JavaScript…"></textarea>
    <div class="row" style="margin-top:12px">
      <label>每段 UTF-8 bytes：<input id="chunkSize" type="number" min="200" max="1600" step="50" value="900" /></label>
      <button id="generate">2. 產生 QR</button>
      <button id="sample">載入測試文字</button>
      <button id="clear">清除</button>
      <span id="status" class="status"></span>
    </div>
  </div>

  <div class="card">
    <b>格式</b>
    <div><code>CQR1|transferId|part/total|crc32|base64url(UTF-8 bytes)</code></div>
    <div class="muted">QR 掃描器只要能把 QR 內容複製成文字，就能把各段帶到另一端重組。</div>
  </div>

  <div id="qrList"></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
  (() => {
    const $ = id => document.getElementById(id);

    function crc32(bytes) {
      let c = 0 ^ (-1);
      for (let i = 0; i < bytes.length; i++) {
        c = (c >>> 8) ^ table[(c ^ bytes[i]) & 0xFF];
      }
      return ((c ^ (-1)) >>> 0).toString(16).padStart(8, '0').toUpperCase();
    }

    const table = (() => {
      const t = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[n] = c >>> 0;
      }
      return t;
    })();

    function base64url(bytes) {
      let binary = '';
      const step = 0x8000;
      for (let i = 0; i < bytes.length; i += step) {
        binary += String.fromCharCode(...bytes.subarray(i, i + step));
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function splitUtf8(text, maxBytes) {
      const all = new TextEncoder().encode(text);
      const chunks = [];
      for (let i = 0; i < all.length; i += maxBytes) chunks.push(all.slice(i, i + maxBytes));
      return chunks;
    }

    function makeId() {
      const a = new Uint32Array(2);
      crypto.getRandomValues(a);
      return Array.from(a, n => n.toString(16).padStart(8,'0')).join('').toUpperCase();
    }

    function render() {
      const text = $('source').value;
      const maxBytes = Math.max(200, Math.min(1600, Number($('chunkSize').value) || 900));
      $('chunkSize').value = maxBytes;
      $('qrList').innerHTML = '';
      if (!text) { $('status').textContent = '請先貼上內容'; return; }
      if (typeof QRCode === 'undefined') {
        $('status').textContent = 'QR 函式庫載入失敗；請確認可連線至 jsDelivr。';
        return;
      }

      const chunks = splitUtf8(text, maxBytes);
      const id = makeId();
      const total = chunks.length;
      const fullBytes = new TextEncoder().encode(text);
      $('status').textContent = `共 ${fullBytes.length} bytes → ${total} 張 QR；整體 CRC32 ${crc32(fullBytes)}`;

      chunks.forEach((bytes, idx) => {
        const part = idx + 1;
        const payload = `CQR1|${id}|${part}/${total}|${crc32(bytes)}|${base64url(bytes)}`;
        const card = document.createElement('div');
        card.className = 'qr-card';
        const title = document.createElement('div');
        title.innerHTML = `<b>PART ${part}/${total}</b> · ${bytes.length} bytes · CRC32 ${crc32(bytes)}`;
        const qr = document.createElement('div');
        qr.className = 'qr';
        const ta = document.createElement('textarea');
        ta.className = 'payload';
        ta.readOnly = true;
        ta.value = payload;
        const copy = document.createElement('button');
        copy.textContent = '複製此段文字';
        copy.onclick = async () => { await navigator.clipboard.writeText(payload); copy.textContent='已複製'; setTimeout(()=>copy.textContent='複製此段文字',1000); };
        card.append(title, qr, ta, copy);
        $('qrList').appendChild(card);
        try {
          new QRCode(qr, { text: payload, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.L });
        } catch (e) {
          qr.textContent = '此段超過 QR 函式庫可處理容量，請把每段 bytes 調小。';
        }
      });
    }

    $('generate').onclick = render;
    $('clear').onclick = () => { $('source').value=''; $('qrList').innerHTML=''; $('status').textContent=''; };
    $('sample').onclick = () => {
      $('source').value = `Option Explicit\n\nSub QR_Code_Test()\n    Dim msg As String\n    msg = "Hello from VBA / 中文測試"\n    MsgBox msg\nEnd Sub`;
    };
  })();
  </script>
</body>
</html>
